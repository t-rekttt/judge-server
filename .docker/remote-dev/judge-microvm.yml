# Orchestrating judge for the local remote grading environment, creating runners through the fake MicroVM API.
id: remote-dev
key: remote-dev-key

# Only used to tell the site which problems this judge can grade; the runners download problem data from storage.
problem_storage_globs:
  - /problems/*

remote_grading: true
remote:
  max_vms: 4
  backend: microvm
  microvm:
    # The fake API in docker-compose.yml; for DigitalOcean: https://api.digitalocean.com and a real token.
    api_url: http://microvm-api:8090
    api_token: fake-do-token
    endpoint_scheme: http
    region: mkc1
    image: vnoj/judge-microvm:dev
    cpus: 2
    memory_mb: 4096
  storage:
    endpoint: http://s3:9000
    bucket: problems
    prefix: ''
    access_key: remote-dev
    secret_key: remote-dev-secret
    region: us-east-1
    url_expiry: 900
